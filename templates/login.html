{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock me-2"></i>Autenticação GEPO</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">E-mail de Acesso</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="seu.email@gepo.local">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="senha" class="form-label fw-bold">Palavra-passe (Senha)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password" placeholder="********">
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary fw-bold py-2">Entrar no Sistema</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-muted small py-3">
                Sistema de Gestão e Operações • GEPO
            </div>
        </div>
    </div>
</div>
{% endblock %}
